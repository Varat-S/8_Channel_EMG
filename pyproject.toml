[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ureca-emg"
version = "0.1.0"
description = "Surface-EMG acquisition and gesture-classification research tools"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4", "numpy", "scikit-learn"]

[tool.setuptools.packages.find]
where = ["src"]
